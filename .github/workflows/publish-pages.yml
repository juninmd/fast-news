name: Publish O Fio to GitHub Pages
run-name: Pages ${{ inputs.edition_id }} @ ${{ inputs.source_commit }}

on:
  workflow_dispatch:
    inputs:
      edition_id:
        description: Immutable edition ID (YYYY-MM-DD:window)
        required: true
      source_commit:
        description: Exact gh-pages content commit to deploy
        required: true

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Validate requested commit and edition
        env:
          CONTENT_COMMIT: ${{ inputs.source_commit }}
          EDITION_ID: ${{ inputs.edition_id }}
        run: |
          set -euo pipefail
          [[ "$CONTENT_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EDITION_ID" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}:(manha|meiodia|tarde|noite)$ ]]
      - name: Check out the immutable content commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm commit is on gh-pages and contains this edition
        env:
          CONTENT_COMMIT: ${{ inputs.source_commit }}
          EDITION_ID: ${{ inputs.edition_id }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin gh-pages:refs/remotes/origin/gh-pages
          git merge-base --is-ancestor "$CONTENT_COMMIT" refs/remotes/origin/gh-pages
          [[ "$(git rev-parse HEAD)" == "$CONTENT_COMMIT" ]]
          jq -e --arg id "$EDITION_ID" '.editions | any(.editionId == $id)' manifest.json >/dev/null
      - name: Upload static site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
